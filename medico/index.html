<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.cdnfonts.com/css/poppins" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <!--

        <h1>Hospital Home</h1>

    <div id="maior">
    <div class="container mt-4">

        <div class="text-center mb-4">
            <strong><h1>Hospital Home</h1></strong>
            <p>Módulo: Atendimento Médico</p>
        </div>

        <div class="card-box shadow meir">
            <h3>Prontuário do Paciente</h3>

            <div class="row">
                <div class="col-md-6">
                    <p><strong>Nome:</strong>João da Silva</p>
                    <p><strong>CPF:</strong>000.000.000.-00</p>
                    <p><strong> Data de Nascimento:</strong> 01/01/1990</p>
                </div>
                
                <div class="col-md-6">
                    <p><strong>Sexo:</strong>Masculino</p>
                    <p><strong>Telefone</strong>(61)99999-9999</p>
                    <p><strong>Convênio:</strong> SUS</p>
                </div>
            </div>
        </div>
        <div class="card-box shadow ficha">

            <h3>Registro de Atendimento</h3>

            <div class="campo">
                <label>CRP/Registro do(a) Profissional:</label>
                <input type="text" placeholder="Digite o registro profissional">
            </div>
            
            <div class="campo">
                <label>Queixa Principal:</label> 
                <textarea placeholder="Motivo principal do encaminhamento para atendimento psicológico (ex.: ansiedade, tristeza, alterações de humor, dificuldades de relacionamento)."></textarea>
            </div>
            
            <div class="campo">
                <label>Tempo de Evolução:</label> 
                <textarea placeholder="Há quanto tempo os sintomas, comportamentos ou dificuldades foram identificados."></textarea>
            </div>
            
            <div class="campo">
                <label>Estado Emocional Atual:</label> 
                <textarea placeholder="Descreva o estado emocional observado no momento do atendimento."></textarea>
            </div>
            
            <div class="campo">
                <label>Histórico da Situação Atual:</label> 
                <textarea placeholder="Relato da evolução dos sintomas, comportamentos ou situações que motivaram o encaminhamento."></textarea>
            </div> 
            
            
            <div class="campo">
                <label>Histórico Psicológico/Psiquiátrico:</label> 
                <textarea placeholder="Informe acompanhamentos anteriores, diagnósticos ou tratamentos psicológicos e psiquiátricos relevantes."></textarea>
            </div> 

            
            <div class="campo">
                <label>Medicações em Uso:</label> 
                <textarea placeholder="Informe os medicamentos utilizados atualmente, especialmente psicotrópicos, quando houver."></textarea>
            </div> 

            
            <div class="campo">
                <label>Aspectos Psicossociais Relevantes:</label> 
                <textarea placeholder="Informações sobre contexto familiar, social, profissional, escolar ou outros fatores relevantes."></textarea>
            </div> 

            
            <div class="campo">
                <label>Encaminhamento/Origem do Atendimento:</label> 
                <textarea placeholder="Informe a origem do encaminhamento (ex.: UBS, hospital, clínica, consultório ou outro serviço)."></textarea>
            </div> 

            
            <div class="campo">
                <label>Motivo do Encaminhamento:</label> 
                <textarea placeholder="Descreva o objetivo do encaminhamento e o acompanhamento psicológico solicitado."></textarea>
            </div> 


            <div class="campo">
                <label>Observações do Profissional:</label> 
                <textarea placeholder="Outras informações relevantes para o profissional de psicologia."></textarea>
            </div> 
            
            <div class="botoes">
                <button class="btn-salvar"><a href="../prescrição/index.html">Salvar Atendimento</a></button>
                <button class="btn-secundario">Cancelar</button>
            </div>           

        </div>
    </div>
    </div>

</body>
</html>
